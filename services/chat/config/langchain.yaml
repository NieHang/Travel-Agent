llm:
  provider: anthropic # openai (OPENAI_API_KEY, OPENAI_BASE_URL) | anthropic (CLAUDE_API_KEY, CLAUDE_BASE_URL)
  model: claude-haiku-5-5
  compactModel: claude-haiku-5-5
  # No temperature: Claude Haiku 5.5 rejects non-default sampling parameters (OpenAI ran at 0).
  # Haiku 5.5 thinks by default and thinking counts toward maxTokens, so leave room above the reply.
  maxTokens: 16000

retrieval:
  enabled: true
  topK: 3

tools:
  enableConstraintCheck: true
  enableEntityLookup: true

features:
  enableStructuredOutput: true
  enableStreaming: true
